<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InventorySync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/index.css">
  <style>
    /* ── Extra app-specific styles ── */
    .match-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 12px;
    }
    .match-side { display: flex; flex-direction: column; gap: 8px; }
    .match-side-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
    .match-title { font-weight: 600; font-size: 14px; color: var(--text-primary); }
    .match-meta  { font-size: 12px; color: var(--text-secondary); }
    .match-score { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 11px; font-weight: 700; }
    .match-score.high   { background: rgba(140,198,48,0.15); color: var(--green); }
    .match-score.medium { background: rgba(241,90,36,0.15);  color: var(--orange); }
    .match-actions { display: flex; gap: 8px; margin-top: 8px; }
    .match-img { width: 64px; height: 64px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-raised); }

    .progress-bar-wrap { height: 4px; background: var(--bg-raised); border-radius: 99px; overflow: hidden; margin-top: 8px; }
    .progress-bar      { height: 100%; background: var(--blue); border-radius: 99px; transition: width 0.4s; }

    .qty-input { width: 70px; height: 32px; padding: 0 8px; text-align: center; background: var(--bg-base); border: 1px solid var(--border-light); border-radius: var(--radius-sm); color: var(--text-primary); font-family: 'DM Mono', monospace; font-size: 13px; }
    .qty-input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--blue-glow); }

    .tabs { display: flex; gap: 2px; padding: 4px; background: var(--bg-surface); border-radius: var(--radius); width: fit-content; margin-bottom: 20px; }
    .tab-btn { height: 32px; padding: 0 16px; border: none; background: transparent; border-radius: var(--radius-sm); cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--text-secondary); transition: all var(--transition); }
    .tab-btn.active { background: var(--bg-card); color: var(--text-primary); box-shadow: var(--shadow-sm); }

    .search-row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
    .search-row .input { max-width: 320px; }

    .rule-row td { overflow: visible; }

    .webami-search-result { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background var(--transition); }
    .webami-search-result:hover { background: var(--bg-raised); }
    .webami-search-result:last-child { border-bottom: none; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="/js/components/toast.js"></script>
<script src="/js/components/modal.js"></script>
<script src="/js/api.js"></script>
<script src="/js/pages/login.js"></script>
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/products.js"></script>
<script src="/js/pages/matching.js"></script>
<script src="/js/pages/orders.js"></script>
<script src="/js/pages/receiving.js"></script>
<script src="/js/pages/rules.js"></script>
<script src="/js/pages/settings.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
